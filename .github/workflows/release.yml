name: Release

on:
  push:
    branches:
      - main
    paths:
      - "word-definition-popup/word-definition-popup.user.js"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from userscript
        id: version
        run: |
          VERSION=$(grep -oP '(?<=@version\s+)\S+' word-definition-popup/word-definition-popup.user.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate extracted version
        run: |
          if [ -z "${{ steps.version.outputs.version }}" ]; then
            echo "❌ Could not extract version from userscript header. Aborting."
            exit 1
          fi
          echo "✅ Version extracted: ${{ steps.version.outputs.version }}"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find matching release notes file
        id: notes
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          FILE="word-definition-popup/release-notes/${{ steps.version.outputs.tag }}.md"
          if [ -f "$FILE" ]; then
            echo "has_file=true" >> "$GITHUB_OUTPUT"
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
          else
            echo "has_file=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release body from commits
        id: body
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          TAG="${{ steps.version.outputs.tag }}"

          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG"
          else
            RANGE="HEAD"
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/$TAG"
          fi

          # Categorise commits by conventional-commit prefix
          FEATURES=$(git log $RANGE --pretty=format:"- %s" | grep -iE "^- (feat|feature)" | sed -E 's/^- (feat|feature)(\([^)]+\))?!?: /- /' || true)
          FIXES=$(git log $RANGE --pretty=format:"- %s" | grep -iE "^- (fix|bug)" | sed -E 's/^- (fix|bug)(\([^)]+\))?!?: /- /' || true)
          CHORES=$(git log $RANGE --pretty=format:"- %s" | grep -iE "^- (chore|refactor|perf|style|docs|test|ci|build)" | sed -E 's/^- (chore|refactor|perf|style|docs|test|ci|build)(\([^)]+\))?!?: /- /' || true)
          OTHER=$(git log $RANGE --pretty=format:"- %s" | grep -ivE "^- (feat|feature|fix|bug|chore|refactor|perf|style|docs|test|ci|build)" || true)

          BODY=""

          if [ -n "$FEATURES" ]; then
            BODY="${BODY}## ✨ New Features\n\n$FEATURES\n\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}## 🐛 Bug Fixes\n\n$FIXES\n\n"
          fi
          if [ -n "$CHORES" ]; then
            BODY="${BODY}## 🔧 Improvements\n\n$CHORES\n\n"
          fi
          if [ -n "$OTHER" ]; then
            BODY="${BODY}## 📝 Other Changes\n\n$OTHER\n\n"
          fi

          BODY="${BODY}---\n**Full Changelog**: $COMPARE_URL"

          # Write to file to avoid quoting issues
          printf "%b" "$BODY" > /tmp/generated_notes.md

      - name: Build final release notes
        id: final_notes
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          if [ "${{ steps.notes.outputs.has_file }}" = "true" ]; then
            # Prepend curated notes, then append generated commit log
            cat "${{ steps.notes.outputs.file }}" > /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            echo "---" >> /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            echo "## 📋 Commit Log" >> /tmp/release_body.md
            echo "" >> /tmp/release_body.md
            cat /tmp/generated_notes.md >> /tmp/release_body.md
          else
            cp /tmp/generated_notes.md /tmp/release_body.md
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release_body.md \
            word-definition-popup/word-definition-popup.user.js
