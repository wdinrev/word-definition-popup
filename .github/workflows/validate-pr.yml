name: Validate PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "word-definition-popup/word-definition-popup.user.js"

jobs:
  validate:
    name: Check Version & Release Notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR version
        id: pr_version
        run: |
          VERSION=$(grep -oP '(?<=@version\s+)\S+' word-definition-popup/word-definition-popup.user.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract base branch version
        id: base_version
        run: |
          git fetch origin ${{ github.base_ref }}
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:word-definition-popup/word-definition-popup.user.js | grep -oP '(?<=@version\s+)\S+')
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure version was bumped
        run: |
          PR="${{ steps.pr_version.outputs.version }}"
          BASE="${{ steps.base_version.outputs.version }}"

          if [ -z "$PR" ]; then
            echo "❌ Could not extract version from PR branch."
            exit 1
          fi

          # Validate semver format
          if ! echo "$PR" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Version '$PR' is not a valid semver (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi

          if [ "$PR" = "$BASE" ]; then
            echo "❌ Version was not bumped. Current: $BASE, PR: $PR"
            echo "   Please update @version in word-definition-popup.user.js"
            exit 1
          fi

          # Compare versions: PR must be strictly greater than BASE
          IFS='.' read -r PR_MAJOR PR_MINOR PR_PATCH <<< "$PR"
          IFS='.' read -r BASE_MAJOR BASE_MINOR BASE_PATCH <<< "$BASE"

          is_greater() {
            [ "$1" -gt "$2" ] && return 0
            [ "$1" -lt "$2" ] && return 1
            return 2  # equal
          }

          version_ok=false
          is_greater "$PR_MAJOR" "$BASE_MAJOR"
          case $? in
            0) version_ok=true ;;
            1) version_ok=false ;;
            2)
              is_greater "$PR_MINOR" "$BASE_MINOR"
              case $? in
                0) version_ok=true ;;
                1) version_ok=false ;;
                2)
                  is_greater "$PR_PATCH" "$BASE_PATCH"
                  [ $? -eq 0 ] && version_ok=true || version_ok=false
                  ;;
              esac
              ;;
          esac

          if [ "$version_ok" = "false" ]; then
            echo "❌ PR version ($PR) must be greater than base version ($BASE)"
            exit 1
          fi

          echo "✅ Version bumped: $BASE → $PR"

      - name: Check release notes file exists
        run: |
          FILE="word-definition-popup/release-notes/${{ steps.pr_version.outputs.tag }}.md"
          if [ ! -f "$FILE" ]; then
            echo "⚠️  No release notes found at $FILE"
            echo "   Create it to include curated notes in the GitHub Release."
            echo "   (This is optional — release notes will be auto-generated from commits if missing.)"
          else
            echo "✅ Release notes found: $FILE"
          fi

      - name: Check tag does not already exist on remote
        run: |
          TAG="${{ steps.pr_version.outputs.tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "❌ Tag $TAG already exists on remote. Please use a new version number."
            exit 1
          fi
          echo "✅ Tag $TAG is available"
