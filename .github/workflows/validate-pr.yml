name: Validate PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'word-definition-popup.user.js'

jobs:
  validate:
    name: Check Version & Release Notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR version
        id: pr_version
        run: |
          VERSION=$(grep -oP '(?<=@version\s{6})\S+' word-definition-popup.user.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract base branch version
        id: base_version
        run: |
          git fetch origin ${{ github.base_ref }}
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:word-definition-popup.user.js | grep -oP '(?<=@version\s{6})\S+')
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure version was bumped
        run: |
          PR="${{ steps.pr_version.outputs.version }}"
          BASE="${{ steps.base_version.outputs.version }}"

          if [ "$PR" = "$BASE" ]; then
            echo "❌ Version was not bumped. Current: $BASE, PR: $PR"
            echo "   Please update @version in word-definition-popup.user.js"
            exit 1
          fi

          # Validate semver format
          if ! echo "$PR" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Version '$PR' is not a valid semver (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi

          echo "✅ Version bumped: $BASE → $PR"

      - name: Check release notes file exists
        run: |
          FILE="release-notes/${{ steps.pr_version.outputs.tag }}.md"
          if [ ! -f "$FILE" ]; then
            echo "⚠️  No release notes found at $FILE"
            echo "   Create it to include curated notes in the GitHub Release."
            echo "   (This is optional — release notes will be auto-generated from commits if missing.)"
          else
            echo "✅ Release notes found: $FILE"
          fi

      - name: Check tag does not already exist on remote
        run: |
          TAG="${{ steps.pr_version.outputs.tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "❌ Tag $TAG already exists on remote. Please use a new version number."
            exit 1
          fi
          echo "✅ Tag $TAG is available"
